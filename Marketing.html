<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dewly - Creative Collection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .card {
            width: 100%;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .card img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Tablet */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            body {
                padding: 20px;
            }
        }

        /* Mobile */
        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            .container {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .card {
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Row 1 -->
        <div class="card">
            <img src="Sun 1.webp" alt="Dewly Sunscreen Creative 1">
        </div>

        <div class="card">
            <img src="Sun 2.webp" alt="Dewly Sunscreen Creative 2">
        </div>

        <div class="card">
            <img src="Sun 3.webp" alt="Dewly Sunscreen Creative 3">
        </div>

        <div class="card">
            <img src="Sun 4.webp" alt="Dewly Sunscreen Creative 4">
        </div>

        <!-- Row 2 -->
        <div class="card">
            <img src="Real 1.webp" alt="Dewly Sunscreen Creative 5">
        </div>

        <div class="card">
            <img src="Real 2.webp" alt="Dewly Sunscreen Creative 6">
        </div>

        <div class="card">
            <img src="Real 3.webp" alt="Dewly Sunscreen Creative 7">
        </div>

        <div class="card">
            <img src="real.webp" alt="Dewly Sunscreen Creative 8">
        </div>

    </div>

</body>
</html>
